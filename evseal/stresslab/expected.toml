# stresslab/expected.toml — EviSeal stress scenario matrix (SPEC §7)
#
# Every entry is run by runner.py / tests/test_stress_matrix.py.
# A mismatch between expected and actual is a BUG in code, not in this file
# (unless SPEC explicitly says otherwise — ask first).
#
# Bundle overall verdicts in verify.py:
#   VERIFIED      all units VERIFIED or REPAIRED, all checks pass
#   NOT_VERIFIED  trust established, but some unit/check failed
#   REJECTED      no basis for trust (manifest missing, profile tampered, untrusted root, policy reject)
#
# Unit statuses (u.status):
#   VERIFIED | REPAIRED | CORRUPT | TAMPERED | SEQUENCE_ERROR | GAP_DECLARED | UNSEALED_TAIL

