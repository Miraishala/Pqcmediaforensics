# ============================================================
# §7C — Fault scenarios
# ============================================================

# Bit-rot at various rates
[[scenario]]
id     = "fault_bitrot_low"
title  = "Fault: bit-rot rate=1e-9 (usually nothing hit in 6 s fixture)"
media  = "ts"
attack = "bitrot"
params = {rate = 1e-9}
overall = "VERIFIED"

[[scenario]]
id     = "fault_bitrot_mid"
title  = "Fault: bit-rot rate=1e-6 (some bits flipped; repaired or corrupt)"
media  = "ts"
attack = "bitrot"
params = {rate = 1e-6}
none   = ["TAMPERED"]
# overall is VERIFIED (if repaired) or NOT_VERIFIED (if beyond parity); omit overall check

[[scenario]]
id     = "fault_bitrot_high"
title  = "Fault: bit-rot rate=1e-5 (many bits; likely CORRUPT or REPAIRED)"
media  = "ts"
attack = "bitrot"
params = {rate = 1e-5}
none   = ["TAMPERED"]

# Burst fault vs interleave
[[scenario]]
id     = "fault_burst_within_interleave"
title  = "Fault: burst length=1 < interleave=2 → REPAIRED"
media  = "ts"
attack = "burst"
params = {length = 1}
overall  = "VERIFIED"
affected = "REPAIRED"
others   = "VERIFIED"
none     = ["TAMPERED"]

[[scenario]]
id     = "fault_burst_spanning_interleave"
title  = "Fault: burst length=3 > interleave=2 → within parity or corrupt"
media  = "ts"
attack = "burst"
params = {length = 3}
none   = ["TAMPERED"]

# Lose 0, m, m+1 shards per stripe
[[scenario]]
id     = "fault_lose_0_shards"
title  = "Fault: lose 0 shards → VERIFIED"
media  = "ts"
attack = "lose_stripe_shards"
params = {count = 0, stripe = 0}
overall = "VERIFIED"

[[scenario]]
id     = "fault_lose_m_shards"
title  = "Fault: lose exactly m=2 shards → REPAIRED"
media  = "ts"
attack = "lose_stripe_shards"
params = {count = 2, stripe = 0}
overall  = "VERIFIED"
affected = "REPAIRED"
others   = "VERIFIED"
none     = ["CORRUPT", "TAMPERED"]

[[scenario]]
id     = "fault_lose_m_plus1_shards"
title  = "Fault: lose m+1=3 shards → CORRUPT unit, NOT_VERIFIED overall"
media  = "ts"
attack = "lose_stripe_shards"
params = {count = 3, stripe = 0}
overall = "NOT_VERIFIED"
none    = ["VERIFIED", "TAMPERED"]

# Manifest copy loss
[[scenario]]
id     = "fault_lose_manifest_primary"
title  = "Fault: lose primary manifest.json → recovered from copy"
media  = "ts"
attack = "lose_manifest_copies"
params = {which = ["manifest.json"]}
overall = "VERIFIED"

[[scenario]]
id     = "fault_lose_manifest_all"
title  = "Fault: lose all manifest copies → REJECTED"
media  = "ts"
attack = "lose_manifest_copies"
params = {which = ["manifest.json", "manifest.copy.json", "manifest_rs"]}
overall = "REJECTED"

# kill -9 mid-seal (crash after 2 fsync'd blocks)
[[scenario]]
id    = "fault_crash_after2"
title = "Fault: crash after 2 blocks → partial bundle, UNSEALED_TAIL"
media = "ts"
kind  = "crash"
params = {after_blocks = 2}
overall = "NOT_VERIFIED"
tail    = "UNSEALED_TAIL"

