# ============================================================
# §7B — Attacks 1–14
# ============================================================

# Attack 1: bit-flip in ciphertext (with EC k=4 m=2 → REPAIRED if within budget)
[[scenario]]
id     = "attack1_bitflip_ts"
title  = "Attack 1: bit-flip in ciphertext → REPAIRED (within parity budget)"
media  = "ts"
attack = "bitflip"
params = {unit = "random", flips = 1}
overall  = "VERIFIED"
affected = "REPAIRED"
others   = "VERIFIED"
none     = ["CORRUPT", "TAMPERED"]

# Attack 1 variant: bit-flip without parity (m=0) → CORRUPT unit, NOT_VERIFIED overall
[[scenario]]
id      = "attack1_bitflip_no_parity"
title   = "Attack 1: bit-flip without parity → CORRUPT unit"
media   = "ts"
attack  = "bitflip"
profile = {ec = {k = 4, m = 0, interleave = 2}}
params  = {unit = "random", flips = 1}
overall  = "NOT_VERIFIED"
affected = "CORRUPT"
others   = "VERIFIED"
none     = ["TAMPERED", "REPAIRED"]

# Attack 2: decrypt-edit-reencrypt (TAMPERED: tag passes, R_i mismatches)
[[scenario]]
id     = "attack2_reencrypt_edit_mp4"
title  = "Attack 2: decrypt+edit+re-encrypt → TAMPERED unit"
media  = "mp4_moovend"
attack = "reencrypt_edit"
overall  = "NOT_VERIFIED"
affected = "TAMPERED"
others   = "VERIFIED"
none     = ["CORRUPT", "SEQUENCE_ERROR"]

[[scenario]]
id     = "attack2_reencrypt_edit_ts"
title  = "Attack 2: decrypt+edit+re-encrypt (TS) → TAMPERED unit"
media  = "ts"
attack = "reencrypt_edit"
overall  = "NOT_VERIFIED"
affected = "TAMPERED"
others   = "VERIFIED"
none     = ["CORRUPT", "SEQUENCE_ERROR"]

# Attack 3: swap in a segment from another recording
[[scenario]]
id     = "attack3_swap_foreign"
title  = "Attack 3: foreign segment spliced in → TAMPERED unit"
media  = "mp4_moovend"
attack = "swap_foreign"
overall  = "NOT_VERIFIED"
affected = "TAMPERED"
others   = "VERIFIED"

# Attack 4: delete segments → SEQUENCE_ERROR at the gap
[[scenario]]
id     = "attack4_delete_units"
title  = "Attack 4: delete 1 segment → SEQUENCE_ERROR"
media  = "mp4_moovend"
attack = "delete_units"
params = {unit = "2", count = 1}
overall = "NOT_VERIFIED"
any     = ["SEQUENCE_ERROR"]
none    = ["TAMPERED"]

# Attack 5: insert a duplicate segment
[[scenario]]
id     = "attack5_insert_unit"
title  = "Attack 5: insert duplicate segment → SEQUENCE_ERROR"
media  = "mp4_moovend"
attack = "insert_unit"
overall = "NOT_VERIFIED"
any     = ["SEQUENCE_ERROR"]
none    = ["TAMPERED"]

# Attack 6: reorder two segments
[[scenario]]
id     = "attack6_reorder"
title  = "Attack 6: swap two segments → SEQUENCE_ERROR"
media  = "mp4_moovend"
attack = "reorder"
overall = "NOT_VERIFIED"
any     = ["SEQUENCE_ERROR"]
none    = ["TAMPERED"]

# Attack 7: truncate tail before final seal
[[scenario]]
id     = "attack7_truncate_tail"
title  = "Attack 7: truncate tail (no final seal) → UNSEALED_TAIL"
media  = "mp4_moovend"
attack = "truncate_tail"
params = {count = 1}
overall = "NOT_VERIFIED"
