# External compare_copy transforms (kind=compare)

[[scenario]]
id        = "img_compare_identical"
title     = "compare_copy: identical copy → all tiles VERIFIED"
media     = "images_jpg"
kind      = "compare"
transform = "identical"
unit      = "1"
verdict   = "VERIFIED"

[[scenario]]
id        = "img_compare_exif_only"
title     = "compare_copy: EXIF-only edit → METADATA_CHANGED, pixel tiles VERIFIED"
media     = "images_jpg"
kind      = "compare"
transform = "exif_edit"
unit      = "1"
verdict   = "METADATA_CHANGED"

[[scenario]]
id        = "img_compare_one_pixel_png"
title     = "compare_copy: single pixel change (PNG) → exactly 1 tile TAMPERED"
media     = "images_png"
kind      = "compare"
transform = "one_pixel"
unit      = "1"
verdict   = "TAMPERED"
tiles     = {TAMPERED = 1}

[[scenario]]
id        = "img_compare_one_coefficient"
title     = "compare_copy: single DCT coefficient change (JPEG) → exactly 1 tile TAMPERED"
media     = "images_jpg"
kind      = "compare"
transform = "one_coefficient"
unit      = "1"
verdict   = "TAMPERED"
tiles     = {TAMPERED = 1}

[[scenario]]
id        = "img_compare_recompress_only"
title     = "compare_copy: recompressed, unedited → no tile above LIKELY_EDITED threshold"
media     = "images_jpg"
kind      = "compare"
transform = "recompress"
unit      = "1"
verdict   = "RECOMPRESSED"
tiles_max = {TAMPERED = 0}

[[scenario]]
id        = "img_compare_recompress_edit"
title     = "compare_copy: recompressed+edited → edited region tiles LIKELY_EDITED"
media     = "images_jpg"
kind      = "compare"
transform = "recompress_edit"
unit      = "1"
verdict   = "RECOMPRESSED"
tiles_min = {LIKELY_EDITED = 1}
tiles_max = {TAMPERED = 0}

[[scenario]]
id        = "img_compare_crop"
title     = "compare_copy: cropped → DERIVED_COPY"
media     = "images_jpg"
kind      = "compare"
transform = "crop"
unit      = "1"
verdict   = "DERIVED_COPY"

[[scenario]]
id        = "img_compare_resize"
title     = "compare_copy: resized → DERIVED_COPY"
media     = "images_jpg"
kind      = "compare"
transform = "resize"
unit      = "1"
verdict   = "DERIVED_COPY"

# Image set with gap record (images numbered 1,2,4,5 — 3 is missing → GAP_DECLARED)
[[scenario]]
id     = "img_gap_declared"
title  = "Image set with gap in capture-time ordering → GAP_DECLARED"
media  = "images_jpg_gap"
overall = "NOT_VERIFIED"
any     = ["GAP_DECLARED"]
