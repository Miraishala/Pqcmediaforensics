# Attack 8a: strip manifest → REJECTED
[[scenario]]
id     = "attack8a_strip_manifest"
title  = "Attack 8a: manifest stripped → REJECTED (no basis for trust)"
media  = "mp4_moovend"
attack = "strip_manifest"
overall = "REJECTED"

# Attack 8b: strip all block/checkpoint/final signatures → REJECTED
[[scenario]]
id     = "attack8b_strip_signatures"
title  = "Attack 8b: signatures stripped → REJECTED"
media  = "mp4_moovend"
attack = "strip_signatures"
overall = "REJECTED"

# Attack 9: profile downgrade in manifest (algorithm swap) → REJECTED
[[scenario]]
id     = "attack9_profile_downgrade"
title  = "Attack 9: profile algorithm downgrade → REJECTED"
media  = "mp4_moovend"
attack = "profile_downgrade"
params = {field = "sign.alg", value = "Ed25519", fix_hash = true}
overall = "REJECTED"

# Attack 10: re-seal with attacker key → REJECTED (untrusted root)
[[scenario]]
id     = "attack10_attacker_reseal"
title  = "Attack 10: re-seal with attacker-controlled root → REJECTED"
media  = "mp4_moovend"
attack = "attacker_reseal"
overall = "REJECTED"

# Attack 11: sign with leaked ephemeral key from an earlier rotation period
[[scenario]]
id      = "attack11_leaked_key_long"
title   = "Attack 11: sign later period with earlier leaked ephemeral key → reject block"
media   = "long"
attack  = "forge_with_leaked_key"
profile = {keys = {rotation_s = 60}}
overall = "NOT_VERIFIED"
none    = ["VERIFIED"]
slow    = true

# Attack 12: replay a valid block signature at a different index
[[scenario]]
id     = "attack12_replay_block"
title  = "Attack 12: replay valid block at wrong index → reject block"
media  = "mp4_moovend"
attack = "replay_block"
params = {src = "1", dst = "3"}
overall = "NOT_VERIFIED"

# Attack 13: backdated timestamp (TSA clock shifted back 10 000 s)
[[scenario]]
id           = "attack13_backdated_tsa"
title        = "Attack 13: backdated TSA timestamp → timestamp window check fail"
media        = "mp4_moovend"
tsa_offset_s = -10000
overall      = "NOT_VERIFIED"

# Attack 14: forged clip boundary C_{i-1}
[[scenario]]
id     = "attack14_forge_clip_boundary"
title  = "Attack 14: forged clip boundary C_{i-1} → chain check fails"
media  = "mp4_moovend"
attack = "forge_clip_boundary"
overall  = "NOT_VERIFIED"

