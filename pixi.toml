[workspace]
authors = ["ncmurali <muraliyaswanth11@gmail.com>"]
channels = ["conda-forge"]
name = "evseal"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
ui-build = { cmd = "npm run build", cwd = "evseal/ui" }
serve = { cmd = "evseal serve --port 8000", env = { EVSEAL_HOME = ".evseal-demo" } }

[dependencies]
python = "3.12.*"
ffmpeg = ">=9.0.2,<10"
cmake = ">=4.4.4,<5"

[pypi-dependencies]
cryptography = ">=50.0.2, <51"
typer = ">=0.27.2, <0.28"
fastapi = ">=0.142.2, <0.143"
uvicorn = { version = ">=0.54.0, <0.55", extras = ["standard"] }
zfec = ">=1.6.0.0, <2"
liboqs-python = ">=0.16.0.1, <0.17"
dilithium-py = ">=1.4.0, <2"
kyber-py = ">=1.2.0, <2"
evseal = { path = ".", editable = true }
rfc8785 = ">=0.1.4, <0.2"
pillow = ">=12"
pillow-heif = ">=1.8"
jpeglib = ">=1.0.2"
numpy = ">=2"
slh-dsa = ">=0.2.5"
python-multipart = ">=0.0.20"

[feature.dev.pypi-dependencies]
pytest = "*"
hypothesis = "*"

[feature.dev.target.linux-64.pypi-dependencies]
atheris = "*"

[environments]
dev = ["dev"]
